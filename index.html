<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Bot Analytics Dashboard</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container-fluid p-0">
    <h1 class="mt-4 mb-4">Аналитика звонков бота</h1>
    
    <!-- KPI Container -->
    <div id="kpi-container"></div>
    
    <!-- Funnel Container -->
    <div id="funnel-container" style="height: 400px; margin: 2rem 0;"></div>
    
    <!-- Dynamics Container -->
    <div id="dynamics-container"></div>
    
    <!-- Line Chart -->
    <div id="line-chart" style="height: 300px; margin: 1rem 0;"></div>
    
    <!-- Bar Chart -->
    <div id="bar-chart" style="height: 300px; margin: 1rem 0;"></div>
    
    <!-- Histogram -->
    <div id="histogram" style="height: 250px; margin: 1rem 0;"></div>
    
    <!-- Duration Stats -->
    <div id="duration-stats"></div>
    
    <!-- Comparison Container -->
    <div id="comparison-container"></div>
    
    <!-- Insights Container -->
    <div id="insights-container"></div>
    
    <!-- Export Button Container -->
    <div id="export-button-container" style="margin: 2rem 0; text-align: center;"></div>
  </div>
  
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
